{% extends "base.html" %}
{% block titulo %}Entrar · Controladoria{% endblock %}
{% block conteudo %}

<div class="cartao" style="max-width:380px; margin:48px auto;">
  <h1 style="font-size:20px; margin-bottom:4px;">Entrar</h1>
  <p class="subtitulo" style="margin-bottom:20px;">Acesso restrito à controladoria.</p>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label style="display:block; font-size:13px; color:var(--cinza); margin-bottom:4px;">Usuário</label>
    <input type="text" name="usuario" class="busca" autofocus autocomplete="username"
           style="width:100%; margin:0 0 14px;">
    <label style="display:block; font-size:13px; color:var(--cinza); margin-bottom:4px;">Senha</label>
    <div class="campo-senha">
      <input type="password" name="senha" class="busca" autocomplete="current-password"
             style="width:100%;">
      <button type="button" class="olho" aria-label="Mostrar senha">mostrar</button>
    </div>
    <button type="submit" class="btn" style="width:100%;">Entrar</button>
  </form>
</div>

{% endblock %}
